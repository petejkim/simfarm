<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#555555"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="SimFarm"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png"><title>SimFarm · Native preservation</title>
    <!-- Boot screen (user request): the original title screen (sftitle.png, 640×480, imported) and a Loading... line, shown
         before any script runs and removed by the app (boot-screen.ts) once the farm or a startup error is on screen.
         Styles are inline because the app stylesheet arrives with the scripts. Both image dimensions come from viewport
         units: WebKit gave a percentage-width image 24px of extra height until the app stylesheet loaded, so the
         title visibly rescaled (user report). Loading... uses a system font, so it never changes when Roboto loads. -->
    <style>#boot{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;background:#555;color:#fff;font:16px system-ui,-apple-system,sans-serif;pointer-events:none}#boot img{--width:min(640px,100vw - 32px,(100vh - 80px)*4/3);display:block;flex:none;width:var(--width);height:calc(var(--width)*3/4)}#boot p{margin:0}</style></head>
  <body><div id="app"></div><div id="boot" role="status"><img src="/assets/sftitle.png" width="640" height="480" alt="SimFarm title screen"><p>Loading...</p></div><script type="module" src="/src/main.tsx"></script></body>
</html>
